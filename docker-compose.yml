# Local development services. Production uses the shared Aurora cluster (schema `agents`), Redis on the EC2 host, S3 and SES.
services:
  postgres:
    # Same major version as the production Aurora cluster (PostgreSQL 18).
    image: pgvector/pgvector:0.8.1-pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # 5433 avoids clashing with a locally installed Postgres
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>. New volume name: the old
      # PostgreSQL 16 volume (pgdata) can't be opened by 18 and is left as it is.
      - pgdata18:/var/lib/postgresql
      # Same role/schema setup as production: schema `agents`, roles agents_owner and agents_app.
      - ./infra/docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./deploy/sql:/deploy-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible store for local dev (MinIO images are no longer freely pullable).
  s3:
    image: adobe/s3mock:latest
    # The named volume is root-owned; the image's default user can't write to it.
    user: root
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: we360-agents-local
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3data:/data


volumes:
  pgdata18:
  s3data:
