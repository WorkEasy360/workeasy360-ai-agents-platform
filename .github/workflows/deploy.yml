# Build the api and web images on GitHub, push them to GHCR, then roll them out on the EC2 host over SSH.
# The host never builds (it is too small, and builds from the OneDrive folder fail) and never holds source
# code: it receives only deploy/ and the migrations, and keeps its own deploy/.env.
#
# Runs after CI (tests, audit, secret scan, migration check) passed for a push to main. CI skips docs-only
# pushes, so they don't deploy. One rollout at a time.
# Rollback: Actions -> Deploy -> an earlier successful run -> "Re-run all jobs" (redeploys that commit's
# images; migrations are not reversed, so they must stay compatible with the previous release).
#
# Repository settings this needs (Settings -> Secrets and variables -> Actions):
#   secrets:   EC2_HOST (the Elastic IP), EC2_USER (ubuntu), EC2_SSH_KEY (private deploy key)
#   variables: DOMAIN (public hostname, e.g. 13-201-45-67.sslip.io)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # The commit CI tested (workflow_run), or the selected ref (manual run).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
          - name: web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - name: Check configuration
        if: vars.DOMAIN == ''
        run: |
          echo "::error::Set the repository variable DOMAIN (Settings → Secrets and variables → Actions → Variables)"
          exit 1

      - name: Image name
        id: image
        # GHCR requires lowercase; the organization name may not be.
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agents" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.prefix }}-${{ matrix.name }}:${{ env.SHA }}
            ${{ steps.image.outputs.prefix }}-${{ matrix.name }}:latest
          # Links the package to this repository, so the workflow token can pull it.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Web only (the api Dockerfile ignores them): baked into the browser bundle / the /api rewrite.
          build-args: |
            NEXT_PUBLIC_GOOGLE_LOGIN=${{ vars.NEXT_PUBLIC_GOOGLE_LOGIN || 'false' }}
            API_INTERNAL_URL=http://api:4000
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 20 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "::error::Could not reach $EC2_HOST on port 22 (the security group must allow 22 from GitHub Actions)"; exit 1; }

      - name: Ship deploy files and migrations
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        # deploy/.env is not in the repository, so the host's copy is never overwritten.
        run: |
          tar -czf - deploy packages/db/migrations \
            | ssh -i ~/.ssh/deploy_key "$TARGET" 'mkdir -p ~/agents && tar -xzf - -C ~/agents'

      - name: Roll out
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        # The short-lived workflow token lets the host pull the images; it is removed when the rollout ends.
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agents"
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy_key "$TARGET" "docker login ghcr.io -u '$ACTOR' --password-stdin" >/dev/null
          status=0
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "cd ~/agents/deploy && PULL=1 IMAGE_PREFIX='$prefix' IMAGE_TAG='${SHA}' bash scripts/deploy.sh" || status=$?
          ssh -i ~/.ssh/deploy_key "$TARGET" 'docker logout ghcr.io >/dev/null' || true
          exit $status

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ vars.DOMAIN }}/api/health" && curl -fsS -o /dev/null "https://${{ vars.DOMAIN }}/login"; then
              echo; echo "### Deployed \`${SHA:0:12}\` to https://${{ vars.DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
              echo "Live: https://${{ vars.DOMAIN }}"; exit 0
            fi
            sleep 6
          done
          echo "::error::Site did not answer after the rollout"; exit 1
