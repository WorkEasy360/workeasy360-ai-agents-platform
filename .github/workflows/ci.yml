name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: we360_agents
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d we360_agents"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: we360-agents-ci
        ports: ["9090:9090"]

    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5433/we360_agents
      DATABASE_URL: postgres://we360_app:we360_app@localhost:5433/we360_agents
      DATABASE_URL_ADMIN: postgres://we360_admin:we360_admin@localhost:5433/we360_agents
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      # 32 zero bytes, base64. CI only.
      LOCAL_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MOCK_LLM: "true"
      S3_BUCKET: we360-agents-ci
      S3_ENDPOINT: http://localhost:9090
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create database roles
        run: psql postgres://postgres:postgres@localhost:5433/we360_agents -f infra/docker/postgres-init.sql

      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level high
      - name: Secret scan (whole history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact
      - name: Infrastructure and Dockerfile misconfiguration scan
        run: docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.67.2 config --exit-code 1 --severity CRITICAL --skip-dirs node_modules /repo

  docker:
    runs-on: ubuntu-latest
    needs: [check, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f apps/api/Dockerfile -t we360-agents-api .
      - run: docker build -f apps/web/Dockerfile -t we360-agents-web .
