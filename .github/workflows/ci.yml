name: CI

on:
  push:
    branches: [main]
    # Documentation-only pushes don't run CI, so they don't deploy either (Deploy runs after CI).
    paths-ignore:
      - "**.md"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as the production Aurora cluster.
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: we360-agents-ci
        ports: ["9090:9090"]

    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      # Same layout as production: database postgres, schema agents, roles agents_app / agents_owner.
      DATABASE_URL: postgres://agents_app:agents_app@localhost:5433/postgres
      DATABASE_URL_ADMIN: postgres://agents_owner:agents_owner@localhost:5433/postgres
      DB_SCHEMA: agents
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      # 32 zero bytes, base64. CI only.
      LOCAL_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MOCK_LLM: "true"
      S3_BUCKET: we360-agents-ci
      S3_ENDPOINT: http://localhost:9090
      S3_FORCE_PATH_STYLE: "true"
      MAIL_TRANSPORT: log

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrations stay inside their own schema
        run: bash deploy/scripts/check-migrations.sh packages/db/migrations

      - name: Create roles and schema (same script as production)
        run: >-
          psql postgres://postgres:postgres@localhost:5433/postgres -v ON_ERROR_STOP=1
          -v owner_pw=agents_owner -v app_pw=agents_app -v db=postgres
          -f deploy/sql/01-create-roles-and-schema.sql

      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level high
      - name: Secret scan (whole history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact
      - name: Infrastructure and Dockerfile misconfiguration scan
        run: docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.67.2 config --exit-code 1 --severity CRITICAL --skip-dirs node_modules --ignorefile /repo/.trivyignore /repo
